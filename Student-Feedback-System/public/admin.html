<!DOCTYPE html>
<html>

<head>

    <title>Admin - Student Feedback</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container" style="width: 95%;">

    <h1>Student Feedback - Admin</h1>


    <!-- SEARCH AND FILTER -->

    <h3>Search / Filter Feedback</h3>

    <input
        type="text"
        id="registerSearch"
        placeholder="Search by Register Number"
    >

    <input
        type="text"
        id="courseSearch"
        placeholder="Filter by Course"
    >

    <button onclick="loadFeedback()">
        Search / Filter
    </button>

    <button onclick="clearSearch()">
        Clear
    </button>


    <br><br>


    <!-- FEEDBACK TABLE -->

    <h2>All Feedback</h2>

    <table border="1" width="100%" cellpadding="10">

        <thead>

            <tr>

                <th>Student Name</th>

                <th>Register No</th>

                <th>Department</th>

                <th>Course</th>

                <th>Faculty</th>

                <th>Rating</th>

                <th>Comments</th>

                <th>Action</th>

            </tr>

        </thead>


        <tbody id="feedbackTable">

        </tbody>

    </table>


    <br><br>


    <!-- FACULTY AVERAGE -->

    <h2>Calculate Faculty Average Rating</h2>

    <input
        type="text"
        id="facultyName"
        placeholder="Enter Faculty Name"
    >

    <button onclick="getAverage()">
        Calculate Average
    </button>

    <p id="averageResult"></p>


    <br>

    <a href="/">
        Back to Student Feedback Form
    </a>

</div>


<script>


// ========================================
// LOAD FEEDBACK
// ========================================

async function loadFeedback() {

    try {

        const registerNo =
            document.getElementById("registerSearch").value;

        const course =
            document.getElementById("courseSearch").value;


        const url =
            `/feedback?registerNo=${encodeURIComponent(registerNo)}&course=${encodeURIComponent(course)}`;


        const response = await fetch(url);

        const feedbacks = await response.json();


        const table =
            document.getElementById("feedbackTable");


        table.innerHTML = "";


        if (feedbacks.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="8">
                        No feedback found
                    </td>
                </tr>
            `;

            return;

        }


        feedbacks.forEach(feedback => {

            table.innerHTML += `

                <tr>

                    <td>${feedback.studentName}</td>

                    <td>${feedback.registerNo}</td>

                    <td>${feedback.department}</td>

                    <td>${feedback.course}</td>

                    <td>${feedback.faculty}</td>

                    <td>${feedback.rating}</td>

                    <td>${feedback.comments}</td>

                    <td>

                        <button
                            onclick="deleteFeedback('${feedback._id}')">
                            Delete
                        </button>

                    </td>

                </tr>

            `;

        });


    } catch (error) {

        console.error(error);

        alert("Error loading feedback");

    }

}


// ========================================
// CLEAR SEARCH
// ========================================

function clearSearch() {

    document.getElementById("registerSearch").value = "";

    document.getElementById("courseSearch").value = "";

    loadFeedback();

}


// ========================================
// DELETE FEEDBACK
// ========================================

async function deleteFeedback(id) {

    const confirmDelete =
        confirm("Are you sure you want to delete this feedback?");


    if (!confirmDelete) {

        return;

    }


    try {

        const response =
            await fetch(`/feedback/${id}`, {

                method: "DELETE"

            });


        const result =
            await response.json();


        alert(result.message);


        loadFeedback();


    } catch (error) {

        console.error(error);

        alert("Error deleting feedback");

    }

}


// ========================================
// FACULTY AVERAGE RATING
// ========================================

async function getAverage() {

    const faculty =
        document.getElementById("facultyName").value.trim();


    if (faculty === "") {

        alert("Please enter faculty name");

        return;

    }


    try {

        const response =
            await fetch(
                `/feedback/average/${encodeURIComponent(faculty)}`
            );


        const result =
            await response.json();


        if (result.averageRating === 0) {

            document.getElementById("averageResult").innerText =
                "No feedback found for this faculty.";

        } else {

            document.getElementById("averageResult").innerText =
                `Average Rating for ${faculty}: ${result.averageRating} / 5`;

        }


    } catch (error) {

        console.error(error);

        alert("Error calculating average rating");

    }

}


// ========================================
// LOAD DATA WHEN PAGE OPENS
// ========================================

loadFeedback();

</script>


</body>

</html>
